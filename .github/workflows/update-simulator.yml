name: Update MakeCode Arcade simulator

# MakecodeGames does not compile games itself — the pxt-core / pxt-arcade
# compiler lives on the Chromebook (MakeCodeGamesIngest). The only MakeCode
# version this repo vendors is the simulator used by /arcade
# (public/simulator/{version} + public/arcade-version.json), so that is all
# this workflow bumps.
#
# Like CreationStationArcade, this workflow checks npm for a new pxt-arcade
# version, vendors the matching simulator, runs lint/tests/build, and then
# opens a pull request with the updated simulator assets.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a new simulator version
        id: check
        run: node scripts/check-simulator-version.mjs

      - name: Apply new simulator version
        if: steps.check.outputs.changed == 'true'
        run: node scripts/apply-simulator-version.mjs "${{ steps.check.outputs.target }}"

      - name: Verify slim simulator variant
        if: steps.check.outputs.changed == 'true'
        run: |
          version="${{ steps.check.outputs.target }}"
          simdir="public/simulator/$version"
          echo "Checking slim variant in $simdir"

          if [ ! -f "$simdir/slim.html" ]; then
            echo "FAIL: $simdir/slim.html is missing" >&2
            exit 1
          fi
          if cmp -s "$simdir/slim.html" "$simdir/index.html"; then
            echo "FAIL: slim.html is identical to index.html — the slim variant was not generated, just copied" >&2
            exit 1
          fi
          if [ ! -f "$simdir/slim.css" ]; then
            echo "FAIL: $simdir/slim.css is missing" >&2
            exit 1
          fi
          if ! grep -F '#wrap' "$simdir/slim.css" | grep -q 'display: none'; then
            echo "FAIL: slim.css is missing the '#wrap { display: none }' rule" >&2
            exit 1
          fi
          if ! grep -q '"simUrl": "/simulator/'"$version"'/slim.html"' public/arcade-version.json; then
            echo "FAIL: arcade-version.json simUrl does not point to slim.html" >&2
            exit 1
          fi
          for f in pxtsim.js sim.js sim.css icons.css; do
            if ! find "$simdir/cdn" -name "$f" | grep -q .; then
              echo "FAIL: $f was not downloaded into $simdir/cdn" >&2
              exit 1
            fi
          done

          echo "OK: slim variant verified"

      - name: Lint and test
        if: steps.check.outputs.changed == 'true'
        run: pnpm lint && pnpm test

      - name: Build Next.js app
        if: steps.check.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
        run: pnpm build

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.check.outputs.commit-message }}
          title: ${{ steps.check.outputs.title }}
          body: |
            Weekly MakeCode Arcade simulator update.

            - simulator / target: ${{ steps.check.outputs.previous }} → ${{ steps.check.outputs.target }}
            - `pxt-arcade` (npm latest): ${{ steps.check.outputs.pxt-arcade }}
            - pxt (compiler) version this target was built with: ${{ steps.check.outputs.pxt }}

            Changes:
            - `public/simulator/${{ steps.check.outputs.target }}/` vendored (full + slim variant)
            - `public/arcade-version.json` updated
            - Old simulator directories are kept so pre-compiled `/arcade` games that still reference an older runtime continue to work.

            Verification:
            - Slim simulator variant verified (chrome hidden)
            - Lint, tests and Next.js build: passed

            Before merging, make sure the compile server (MakeCodeGamesIngest) has been bumped to matching `pxt-arcade` ${{ steps.check.outputs.pxt-arcade }} / pxt-core ${{ steps.check.outputs.pxt }} so `/compilers/png-to-js` output matches this simulator.
          branch: update-simulator/${{ steps.check.outputs.target }}
          base: main
