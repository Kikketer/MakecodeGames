name: Update MakeCode Arcade simulator

# MakecodeGames does not compile games itself — the pxt-core / pxt-arcade
# compiler lives on the Chromebook (MakeCodeGamesIngest). The only MakeCode
# version this repo vendors is the simulator used by /arcade
# (public/simulator/{version} + public/arcade-version.json), so that is all
# this workflow bumps.
#
# Like CreationStationArcade, this workflow checks npm for a new pxt-arcade
# version, vendors the matching simulator, runs lint/tests/build, and then
# commits and pushes the result directly to main.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a new simulator version
        id: check
        run: node scripts/check-simulator-version.mjs

      - name: Apply new simulator version
        if: steps.check.outputs.changed == 'true'
        run: node scripts/apply-simulator-version.mjs "${{ steps.check.outputs.target }}"

      - name: Verify slim simulator variant
        if: steps.check.outputs.changed == 'true'
        run: |
          version="${{ steps.check.outputs.target }}"
          simdir="public/simulator/$version"
          echo "Checking slim variant in $simdir"

          if [ ! -f "$simdir/slim.html" ]; then
            echo "FAIL: $simdir/slim.html is missing" >&2
            exit 1
          fi
          if cmp -s "$simdir/slim.html" "$simdir/index.html"; then
            echo "FAIL: slim.html is identical to index.html — the slim variant was not generated, just copied" >&2
            exit 1
          fi
          if [ ! -f "$simdir/slim.css" ]; then
            echo "FAIL: $simdir/slim.css is missing" >&2
            exit 1
          fi
          if ! grep -F '#wrap' "$simdir/slim.css" | grep -q 'display: none'; then
            echo "FAIL: slim.css is missing the '#wrap { display: none }' rule" >&2
            exit 1
          fi
          if ! grep -q '"simUrl": "/simulator/'"$version"'/slim.html"' public/arcade-version.json; then
            echo "FAIL: arcade-version.json simUrl does not point to slim.html" >&2
            exit 1
          fi
          for f in pxtsim.js sim.js sim.css icons.css; do
            if ! find "$simdir/cdn" -name "$f" | grep -q .; then
              echo "FAIL: $f was not downloaded into $simdir/cdn" >&2
              exit 1
            fi
          done

          echo "OK: slim variant verified"

      - name: Lint and test
        if: steps.check.outputs.changed == 'true'
        run: pnpm lint && pnpm test

      - name: Build Next.js app
        if: steps.check.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
        run: pnpm build

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "${{ steps.check.outputs.commit-message }}" \
            -m "simulator / target: ${{ steps.check.outputs.previous }} → ${{ steps.check.outputs.target }}" \
            -m "pxt-arcade: ${{ steps.check.outputs.pxt-arcade }}" \
            -m "pxt-core: ${{ steps.check.outputs.pxt }}" \
            -m "Automated simulator bump. Old simulator directories are kept for backwards compatibility."
          git push origin main
