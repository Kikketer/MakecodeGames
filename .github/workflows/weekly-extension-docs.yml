name: Weekly extension docs

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      vercel_url:
        description: "Vercel URL to hit (defaults to INGEST_URL repo variable). Use a preview deployment URL when testing a branch."
        required: false
        default: ""
      extension:
        description: "Single extension to document (owner/repo), or empty for the full batch."
        required: false
        default: ""

jobs:
  document-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Start extension documentation workflow
        # This starts the Vercel Workflow and gets an immediate ack.
        # The workflow fans out one child per extension, each creating a
        # branch + PR with auto-generated documentation. Watch progress in
        # the Vercel dashboard (Observability > Workflows).
        #
        # To test on a branch: deploy the branch as a Vercel preview, then
        # trigger this workflow with the preview URL in the vercel_url input.
        env:
          VERCEL_URL: ${{ inputs.vercel_url || vars.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          EXTENSION: ${{ inputs.extension }}
        run: |
          if [ -n "$EXTENSION" ]; then
            echo "Documenting single extension: $EXTENSION"
            curl -sS --fail-with-body -X GET "${VERCEL_URL}/api/extensions/document?extension=${EXTENSION}" \
              -H "Authorization: Bearer ${INGEST_SECRET}"
          else
            echo "Documenting full batch of extensions"
            curl -sS --fail-with-body -X GET "${VERCEL_URL}/api/extensions/document" \
              -H "Authorization: Bearer ${INGEST_SECRET}"
          fi
