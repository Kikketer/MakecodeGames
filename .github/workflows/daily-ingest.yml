name: Daily game ingest

on:
  schedule:
    - cron: "0 2,6,14,18 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest games from MakeCode forums
        # This just starts the ingest Workflow and gets an immediate ack -
        # the route no longer waits for ingest to finish. Watch progress and
        # results in the Vercel dashboard (Observability > Workflows) or the
        # ingest_log table, not this job's logs.
        run: |
          curl -sS --fail-with-body -X POST "${{ vars.INGEST_URL }}/api/games/ingest" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            -H "CF-Access-Client-Id: ${{ vars.CLOUDFLARE_CLIENT }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CLOUDFLARE_SECRET }}"

      - name: Email on failure
        # Sends via Gmail SMTP (sends as yourself, to yourself).
        # Needs repo secrets SMTP_USERNAME (full email) and SMTP_PASSWORD
        # (Google app password — https://myaccount.google.com/apppasswords).
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "daily-ingest failed on ${{ github.repository }}"
          to: ${{ secrets.SMTP_USERNAME }}
          from: "MakecodeGames CI <${{ secrets.SMTP_USERNAME }}>"
          body: |
            The daily-ingest workflow failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            A curl error 530 / error code 1033 means the Cloudflare tunnel
            to the ingest box is down (box off/asleep or cloudflared not running).
