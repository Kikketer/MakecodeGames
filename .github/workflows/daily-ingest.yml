name: Daily game ingest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest games from MakeCode forums
        run: |
          curl -s -X GET "${{ secrets.INGEST_URL }}/api/games/ingest" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}"
