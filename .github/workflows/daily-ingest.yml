name: Daily game ingest

on:
  schedule:
    - cron: "0 2,6,14,18 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest games from MakeCode forums
        # This just starts the ingest Workflow and gets an immediate ack -
        # the route no longer waits for ingest to finish. Watch progress and
        # results in the Vercel dashboard (Observability > Workflows) or the
        # ingest_log table, not this job's logs.
        run: |
          curl -sS --fail-with-body -X GET "${{ vars.INGEST_URL }}/api/games/ingest" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}"
