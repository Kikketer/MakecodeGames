name: Daily game ingest

on:
  schedule:
    - cron: "0 2,6,14,18 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest games from MakeCode forums
        # This just starts the ingest Workflow and gets an immediate ack -
        # the route no longer waits for ingest to finish. Watch progress and
        # results in the Vercel dashboard (Observability > Workflows) or the
        # ingest_log table, not this job's logs.
        run: |
          curl -sS --fail-with-body -X POST "${{ vars.INGEST_URL }}/api/games/ingest" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            -H "CF-Access-Client-Id: ${{ vars.CLOUDFLARE_CLIENT }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CLOUDFLARE_SECRET }}"

      - name: Email on failure
        # Sends via iCloud SMTP using curl's built-in STARTTLS support (no
        # third-party action). Needs repo secrets SMTP_USERNAME (full
        # @icloud/@me/@mac address) and SMTP_PASSWORD (app-specific password —
        # appleid.apple.com > Sign-In and Security). NOTIFY_EMAIL is the
        # recipient; defaults to sending to the sender itself.
        if: failure()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || secrets.SMTP_USERNAME }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'From: MakecodeGames CI <%s>\nTo: %s\nSubject: daily-ingest failed on %s\n\nThe daily-ingest workflow failed.\n\nRun: %s\n\nA curl error 530 / error code 1033 means the Cloudflare tunnel to the ingest box is down (box off/asleep or cloudflared not running).\n' \
            "$SMTP_USERNAME" "$NOTIFY_EMAIL" "${{ github.repository }}" "$RUN_URL" > "$RUNNER_TEMP/mail.txt"
          curl -sS --fail-with-body "smtp://smtp.mail.me.com:587" \
            --ssl-reqd \
            --user "${SMTP_USERNAME}:${SMTP_PASSWORD}" \
            --mail-from "$SMTP_USERNAME" \
            --mail-rcpt "$NOTIFY_EMAIL" \
            --upload-file "$RUNNER_TEMP/mail.txt"
