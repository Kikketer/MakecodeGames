name: Update compiler and simulator

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      - name: Check for new compiler versions
        id: check
        run: node scripts/check-compiler-versions.mjs

      - name: Apply new compiler version
        if: steps.check.outputs.changed == 'true'
        run: node scripts/apply-compiler-version.mjs

      - name: Refresh root lockfile
        if: steps.check.outputs.changed == 'true'
        run: pnpm install

      - name: Verify slim simulator variant
        if: steps.check.outputs.changed == 'true'
        run: |
          version=$(node -e "console.log(require('./scripts/compiler-version.json').simulator)")
          simdir="public/simulator/$version"
          echo "Checking slim variant in $simdir"

          # slim.html must exist and must NOT be identical to index.html
          if [ ! -f "$simdir/slim.html" ]; then
            echo "FAIL: $simdir/slim.html is missing" >&2
            exit 1
          fi
          if cmp -s "$simdir/slim.html" "$simdir/index.html"; then
            echo "FAIL: slim.html is identical to index.html — the slim variant was not generated, just copied" >&2
            exit 1
          fi

          # slim.css must exist and must contain the #wrap hiding rule
          if [ ! -f "$simdir/slim.css" ]; then
            echo "FAIL: $simdir/slim.css is missing" >&2
            exit 1
          fi
          if ! grep -F '#wrap' "$simdir/slim.css" | grep -q 'display: none'; then
            echo "FAIL: slim.css is missing the '#wrap { display: none }' rule" >&2
            exit 1
          fi

          # arcade-version.json simUrl must point at slim.html, not index.html
          if ! grep -q '"simUrl": "/simulator/'"$version"'/slim.html"' public/arcade-version.json; then
            echo "FAIL: arcade-version.json simUrl does not point to slim.html" >&2
            exit 1
          fi

          echo "OK: slim variant verified"

      - name: Build compile-service
        if: steps.check.outputs.changed == 'true'
        run: cd apps/compile-service && npm install && npm run build

      - name: Verify pxt-core JS patches
        if: steps.check.outputs.changed == 'true'
        run: |
          for dir in . apps/compile-service; do
            for file in node_modules/pxt-core/built/pxt.js node_modules/pxt-core/built/pxtlib.js; do
              p="$dir/$file"
              if [ ! -f "$p" ]; then
                echo "Missing $p" >&2
                exit 1
              fi
              if ! grep -F 'conv = "as" + tp.replace(/.*::/g, "").replace(/\*/g, "");' "$p" >/dev/null; then
                echo "JS wrapper patch missing in $p" >&2
                exit 1
              fi
            done
          done

      - name: Build native x86-64 runtime
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev pkg-config
          npx tsx scripts/build-native-linux.ts tests/fixtures/Paddle-the-River.png
          mkdir -p test-results
          ls -la tmp/*.tar.gz
          cp tmp/*.tar.gz test-results/

      - name: Build Next.js app
        if: steps.check.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
        run: pnpm build

      - name: Install Playwright browsers
        if: steps.check.outputs.changed == 'true'
        run: pnpm exec playwright install chromium

      - name: Run smoke test
        if: steps.check.outputs.changed == 'true'
        run: pnpm smoke

      - name: Upload artifacts
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compiler-update-artifacts
          path: |
            test-results/
            public/twominute/makecode/*.js

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.check.outputs.commit-message }}
          title: ${{ steps.check.outputs.title }}
          body: |
            Weekly compiler update.

            - `pxt-core`: ${{ steps.check.outputs.pxt-core }}
            - `pxt-arcade`: ${{ steps.check.outputs.pxt-arcade }}
            - `target` / `simulator`: ${{ steps.check.outputs.target }}

            Verification:
            - JS wrapper patch applied: verified
            - Native Linux x86-64 runtime build: passed
            - JS compile and headless simulator: passed
            - ARM ELF cloud compile: passed
            - Slim simulator variant verified (chrome hidden)

            Manual checks before merging:
            - [ ] `/twominute` MakeCode games show ONLY the game canvas — no Menu/Reset, A/B buttons, D-pad, or Microsoft logo (slim variant intact)

            This PR was generated by the `update-compiler.yml` workflow. The checks above passed, but please verify `/twominute` and `/game` manually before merging.
          branch: update-compiler/${{ steps.check.outputs.pxt-core }}-${{ steps.check.outputs.target }}
          base: main
