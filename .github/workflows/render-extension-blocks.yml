name: Render extension blocks

on:
  push:
    branches:
      - main
    paths:
      - "content/extensions/**"
  workflow_dispatch:
    inputs:
      extension:
        description: "Single extension to render (owner/repo), or empty for all extensions."
        required: false
        default: ""

# Needed to create render PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Render block SVGs
        env:
          EXTENSION: ${{ inputs.extension }}
        run: |
          if [ -n "$EXTENSION" ]; then
            echo "Rendering single extension: $EXTENSION"
            pnpm render-blocks -- --extension "$EXTENSION"
          else
            echo "Rendering all extensions"
            pnpm render-blocks
          fi

      - name: Stage rendered SVGs
        run: git add public/extensions/**

      - name: Create or update render PR
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: render-blocks/pending
          title: "Render extension block SVGs"
          body: |
            Auto-generated PR with rendered block SVGs for extension doc pages.

            Triggered by changes to `content/extensions/**` or manual dispatch.
            This PR is automatically updated when new renders are available.

            Generated by the `render-extension-blocks` workflow.
          commit-message: "Render extension block SVGs"
          add-paths: |
            public/extensions/**
          delete-branch: true
