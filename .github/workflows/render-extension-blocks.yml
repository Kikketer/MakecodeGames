name: Render extension blocks

on:
  push:
    branches:
      - main
    paths:
      - "content/extensions/**"
  workflow_dispatch:
    inputs:
      extension:
        description: "Single extension to render (owner/repo), or empty for all extensions."
        required: false
        default: ""

# Needed to create render PRs
permissions:
  contents: write
  pull-requests: write

# A batch of merged doc PRs should collapse to a single latest run instead of
# racing on the shared render-blocks/pending branch.
concurrency:
  group: render-extension-blocks
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Render block SVGs
        env:
          EXTENSION: ${{ inputs.extension }}
        run: |
          if [ -n "$EXTENSION" ]; then
            echo "Rendering single extension: $EXTENSION"
            pnpm render-blocks -- --extension "$EXTENSION"
          else
            echo "Rendering all extensions"
            pnpm render-blocks
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & push rendered SVGs
        id: commit
        run: |
          git checkout -B render-blocks/pending
          git add public/extensions/**
          if git diff --staged --quiet; then
            echo "No SVG changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Render extension block SVGs"
            git push --force-with-lease origin render-blocks/pending
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update render PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head render-blocks/pending --base main --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --head render-blocks/pending \
              --base main \
              --title "Render extension block SVGs" \
              --body "Auto-generated PR with rendered block SVGs for extension doc pages.

          Triggered by changes to \`content/extensions/**\` or manual dispatch.
          This PR is automatically updated when new renders are available.

          Generated by the \`render-extension-blocks\` workflow."
          else
            echo "Render PR #$PR_NUMBER already open — branch push updated it."
          fi
